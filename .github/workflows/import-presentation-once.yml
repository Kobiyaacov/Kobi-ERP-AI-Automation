name: Import prepared presentation once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-presentation-once.yml']

permissions:
  contents: write

concurrency:
  group: import-prepared-presentation
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1

      - name: Verify and unpack the prepared documentation only
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import pathlib
          import stat
          import subprocess
          import urllib.request
          import zipfile

          source = 'https://at.adobe.com/prSDnDxsiW05E86w'
          expected_digest = '3d416c6801c63162b351114ecc5e176d0bff00bbc1d26d875af7424658076845'
          expected_readme = '4b345880f737cc3ebe0b4bcb8476c08cd02adec2'
          allowed = {
              'README.md',
              'docs/presentation/README.md',
              'docs/presentation/cover.svg',
              'docs/presentation/01-dashboard.png',
              'docs/presentation/02-leads.png',
              'docs/presentation/03-products.png',
              'docs/presentation/04-invoice.png',
              'docs/presentation/05-app-chat.png',
              'docs/presentation/06-telegram-support.png',
              'docs/presentation/07-airtable.png',
              'docs/presentation/08-drive.png',
              'docs/presentation/09-manager-digest.png',
          }
          request = urllib.request.Request(source, headers={'User-Agent': 'Kobi-ERP-Documentation-Importer/1.0'})
          with urllib.request.urlopen(request, timeout=45) as response:
              data = response.read(5_000_001)
          if len(data) > 5_000_000 or hashlib.sha256(data).hexdigest() != expected_digest:
              raise SystemExit('The presentation archive did not pass its integrity check; no files were changed.')
          current_readme = subprocess.check_output(['git', 'hash-object', 'README.md'], text=True).strip()
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              members = archive.infolist()
              if len(members) != len(allowed) or {item.filename for item in members} != allowed:
                  raise SystemExit('The archive contains unexpected paths; no files were changed.')
              if current_readme != expected_readme and pathlib.Path('README.md').read_bytes() != archive.read('README.md'):
                  raise SystemExit('README changed since preparation; stopping rather than overwriting newer work.')
              payloads = {}
              for item in members:
                  if item.is_dir() or stat.S_ISLNK(item.external_attr >> 16) or item.file_size > 2_000_000:
                      raise SystemExit('Unsupported archive member; no files were changed.')
                  payload = archive.read(item)
                  if item.filename.endswith('.png') and not payload.startswith(b'\x89PNG\r\n\x1a\n'):
                      raise SystemExit('Invalid screenshot; no files were changed.')
                  if item.filename.endswith(('.md', '.svg')):
                      payload.decode('utf-8')
                  target = pathlib.Path(item.filename)
                  if target.is_symlink() or any(parent.is_symlink() for parent in target.parents):
                      raise SystemExit('Refusing to follow a symlink.')
                  payloads[item.filename] = payload
              for name, payload in payloads.items():
                  target = pathlib.Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(payload)
          print('Verified and installed 12 presentation files; existing workflow files were not modified.')
          PY

      - name: Commit the presentation
        shell: bash
        run: |
          git add -- README.md docs/presentation
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          if any(path != 'README.md' and not path.startswith('docs/presentation/') for path in paths):
              raise SystemExit('Unexpected staged change; refusing to publish.')
          print('\n'.join(paths))
          PY
          if git diff --cached --quiet; then
            echo 'The presentation is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: present Kobi ERP as a visual capstone case study'
          git push origin HEAD:main
