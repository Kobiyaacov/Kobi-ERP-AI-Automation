name: Check workflow viewer links

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/workflows/**'
      - '.github/workflows/check-workflow-viewer.yml'
  workflow_dispatch:

permissions: {}
concurrency:
  group: workflow-viewer-link-check
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published workspace, source data and all 11 models
        shell: bash
        run: |
          python3 -u - <<'PY'
          import json, os, re, time, urllib.request
          base = 'https://kobiyaacov.github.io/Kobi-ERP-AI-Automation/'
          models = ['01-leads-intake.json', '02-sales-cold-emails.json',
                    '03-policies-embedding.json', '04-products-embedding.json',
                    '05-customer-service-agent.json', '06-sales-reply-checker.json',
                    '07-invoice-validation.json', '08-invoice-maker-drive.json',
                    '09-manager-agent.json', '10-app-api.json', '11-smart-treatment-center.json']
          def get(path, attempt):
              request = urllib.request.Request(base + path + '?check=' + os.environ.get('GITHUB_RUN_ID', 'manual') + '-' + str(attempt), headers={'User-Agent': 'Kobi-ERP-workspace-check', 'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(request, timeout=8) as response:
                  if response.status != 200:
                      raise RuntimeError('Non-200 response: ' + path)
                  return response.read().decode('utf-8')
          def project_data(html):
              match = re.search(r'<script\b[^>]*id=[\"\x27]project-data[\"\x27][^>]*>(.*?)</script>', html, re.S)
              if not match:
                  raise RuntimeError('Project data missing')
              return json.loads(match.group(1))
          for attempt in range(1, 13):
              try:
                  for path in ['', 'workflows/']:
                      if 'Kobi_ERP_Workflows.html' not in get(path, attempt):
                          raise RuntimeError('Entry link missing: ' + path)
                  html = get('workflows/Kobi_ERP_Workflows.html', attempt)
                  manifest = project_data(html)
                  if manifest.get('version') != 2:
                      raise RuntimeError('Workspace update has not propagated yet')
                  source = project_data(get('workflows/' + manifest['source'], attempt))
                  if sorted(f['num'] for f in source['flows']) != list(range(1, 12)):
                      raise RuntimeError('Expected all 11 original flow descriptions')
                  if not all(source.get('shots', {}).get(str(n), '').startswith('data:image/') for n in [1, 2, 3, 4, 5, 6, 8, 9, 10, 11]):
                      raise RuntimeError('An original screenshot is missing')
                  if 'prepareGraph' not in get('workflows/experience.js', attempt):
                      raise RuntimeError('Workspace JavaScript missing')
                  if '.canvas-pane' not in get('workflows/experience.css', attempt):
                      raise RuntimeError('Workspace stylesheet missing')
                  node_total = 0
                  for filename in models:
                      model = json.loads(get('workflows/models/' + filename, attempt))
                      names = {n['name'] for n in model['nodes']}
                      node_total += len(names)
                      if model.get('active') is not False:
                          raise RuntimeError('Public snapshot must be inactive: ' + filename)
                      for node in model['nodes']:
                          if 'credentials' in node:
                              raise RuntimeError('Unexpected credential reference: ' + filename)
                      for source_name, ports in model['connections'].items():
                          if source_name not in names:
                              raise RuntimeError('Unknown source node: ' + filename)
                          for outputs in ports.values():
                              for output in outputs:
                                  if any(edge['node'] not in names for edge in output):
                                      raise RuntimeError('Unknown target node: ' + filename)
                  print('PASS: public entrypoints, HTML, CSS, JavaScript, 11 model snapshots, 11 descriptions and 10 original screenshots.')
                  print('Model nodes including notes: ' + str(node_total))
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                      summary.write('## Workspace publication check\n\nPassed: entrypoints, app assets, 11 graph snapshots, 11 source descriptions and 10 original screenshots.\n\nThis checks static publication and graph structure, not n8n execution or browser interactions.\n')
                  break
              except Exception as error:
                  print('Attempt ' + str(attempt) + ': ' + str(error))
                  if attempt == 12:
                      raise SystemExit(str(error))
                  time.sleep(10)
          PY
